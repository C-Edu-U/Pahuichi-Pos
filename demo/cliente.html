<!doctype html>
<html lang="es-BO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pantalla del cliente · Pahuichi</title>
  <meta name="theme-color" content="#13603e">
  <link rel="icon" href="assets/img/icono.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/archivo-variable-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body class="pantalla-cliente">
  <header class="pantalla-cliente__cabeza">
    <p class="acceso__logo"><span class="marca__sello" aria-hidden="true"><span></span></span><span>Pahuichi</span></p>
    <p class="pantalla-cliente__pedido" id="pc-pedido">Pedido 043</p>
  </header>

  <main class="pantalla-cliente__cuerpo" aria-live="polite">
    <section class="pantalla-cliente__lista" aria-label="Tu pedido">
      <ul class="pantalla-cliente__lineas" id="pc-lineas" role="list"></ul>
      <p class="pantalla-cliente__vacio" id="pc-vacio">¡Bienvenido! Tu pedido aparecerá aquí.</p>
    </section>
    <section class="pantalla-cliente__cobro">
      <div class="pantalla-cliente__total">
        <p class="pantalla-cliente__etiqueta">Total a pagar</p>
        <p class="pantalla-cliente__monto"><span class="cifra__moneda">Bs</span><span id="pc-total">0,00</span></p>
        <p class="pantalla-cliente__descuento" id="pc-descuento" hidden></p>
      </div>
      <div class="pantalla-cliente__qr" id="pc-qr" hidden>
        <img src="assets/img/qr-cobro-demo.svg" alt="QR para pagar Bs 0,50" width="220" height="220">
        <p>Escanea con la app de tu banco: <strong class="num">Bs 0,50</strong></p>
      </div>
    </section>
  </main>

  <script src="assets/js/app.js"></script>
  <script>
    /* Pantalla del cliente (extra): refleja el pedido del POS de esta PC.
       Con servidor, por Server-Sent Events; aquí, por localStorage. */
    (function () {
      var P = window.Pahuichi;
      var $ = function (id) { return document.getElementById(id); };
      function pintar() {
        var e = null;
        try { e = JSON.parse(P.leer('pahuichi.pantalla') || 'null'); } catch (x) { e = null; }
        e = e || { pedido: '043', lineas: [], total: 0, descuento: 0, qr: false };
        $('pc-pedido').textContent = 'Pedido ' + e.pedido;
        var ul = $('pc-lineas');
        ul.innerHTML = '';
        e.lineas.forEach(function (l) {
          var li = document.createElement('li');
          li.innerHTML = '<span class="num"></span><span></span><span class="num"></span>';
          li.children[0].textContent = l.cantidad + ' ×';
          li.children[1].textContent = l.nombre;
          li.children[2].textContent = P.bs(l.subtotal);
          ul.appendChild(li);
        });
        $('pc-vacio').hidden = e.lineas.length > 0;
        $('pc-total').textContent = P.bs(e.total);
        $('pc-descuento').hidden = !e.descuento;
        $('pc-descuento').textContent = 'Ahorras Bs ' + P.bs(e.descuento) + ' con promociones';
        $('pc-qr').hidden = !e.qr;
      }
      window.addEventListener('storage', function (ev) { if (ev.key === 'pahuichi.pantalla') pintar(); });
      pintar();
    })();
  </script>
</body>
</html>
