ServerName localhost
ServerTokens Prod
ServerSignature Off

# HTTP solo redirige a HTTPS
<VirtualHost *:80>
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}:${PUERTO_HTTPS}%{REQUEST_URI} [R=302,L]
</VirtualHost>

<VirtualHost *:443>
    DocumentRoot /var/www/pahuichi/public

    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/pahuichi.crt
    SSLCertificateKeyFile /etc/apache2/certs/pahuichi.key

    # public/ es la única carpeta expuesta; todo lo que no es un archivo va al front controller
    <Directory /var/www/pahuichi/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
