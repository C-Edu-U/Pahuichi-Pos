<!-- {"titulo":"Nueva promoción","modulo":"promociones","h1":"Nueva promoción","h1id":"titulo-promo","js":["datos.js","promocion-form.js"],"cssExtra":["modulos.css"]} -->
    <main class="contenido" id="contenido">
      <a class="volver" href="promociones.html">
        <svg class="icono icono--sm" aria-hidden="true"><use href="#i-volver"></use></svg>
        Promociones
      </a>

      <form class="formulario formulario--una" id="form-promo" novalidate>
        <input type="hidden" name="_csrf" value="">

        <fieldset class="grupo-campos">
          <legend class="grupo-campos__titulo">Promoción</legend>
          <div class="campo campo--ancho">
            <label class="campo__etiqueta" for="p-nombre">Nombre</label>
            <input class="control" id="p-nombre" type="text" maxlength="60" placeholder="Así se verá en el pedido y en el ticket" aria-describedby="p-nombre-error">
            <p class="campo__error" id="p-nombre-error" hidden></p>
          </div>
          <fieldset class="tipos campo--ancho">
            <legend class="campo__etiqueta">Tipo</legend>
            <label class="tipo-opcion"><input type="radio" name="tipo" value="descuento" checked><span class="tipo-opcion__caja"><svg class="icono" aria-hidden="true"><use href="#i-promocion"></use></svg><span class="tipo-opcion__titulo">Descuento</span><span class="tipo-opcion__ayuda">A un producto o categoría, en % o monto</span></span></label>
            <label class="tipo-opcion"><input type="radio" name="tipo" value="combo"><span class="tipo-opcion__caja"><svg class="icono" aria-hidden="true"><use href="#i-combo"></use></svg><span class="tipo-opcion__titulo">Combo</span><span class="tipo-opcion__ayuda">Varios productos a precio especial</span></span></label>
            <label class="tipo-opcion"><input type="radio" name="tipo" value="regalo"><span class="tipo-opcion__caja"><svg class="icono" aria-hidden="true"><use href="#i-regalo"></use></svg><span class="tipo-opcion__titulo">Regalo</span><span class="tipo-opcion__ayuda">Compra X y recibe Y gratis</span></span></label>
            <label class="tipo-opcion"><input type="radio" name="tipo" value="cumpleanos"><span class="tipo-opcion__caja"><svg class="icono" aria-hidden="true"><use href="#i-pastel"></use></svg><span class="tipo-opcion__titulo">Cumpleaños</span><span class="tipo-opcion__ayuda">Para clientes registrados, una vez al año</span></span></label>
          </fieldset>
        </fieldset>

        <!-- Descuento -->
        <fieldset class="grupo-campos" data-tipo-campos="descuento">
          <legend class="grupo-campos__titulo">Descuento</legend>
          <div class="campo">
            <label class="campo__etiqueta" for="d-aplica">Se aplica a</label>
            <select class="control" id="d-aplica"></select>
          </div>
          <div class="campo">
            <label class="campo__etiqueta" for="d-valor">Valor</label>
            <div class="control-grupo">
              <input class="control control--numero" id="d-valor" type="text" inputmode="decimal" aria-describedby="d-valor-error">
              <select class="control control-grupo__select" id="d-tipo-valor" aria-label="Tipo de valor">
                <option value="porcentaje">%</option>
                <option value="monto">Bs</option>
              </select>
            </div>
            <p class="campo__error" id="d-valor-error" hidden></p>
          </div>
        </fieldset>

        <!-- Combo -->
        <fieldset class="grupo-campos" data-tipo-campos="combo" hidden>
          <legend class="grupo-campos__titulo">Combo</legend>
          <div class="campo">
            <label class="campo__etiqueta" for="c-uno">Producto 1</label>
            <select class="control" id="c-uno"></select>
          </div>
          <div class="campo">
            <label class="campo__etiqueta" for="c-dos">Producto 2</label>
            <select class="control" id="c-dos"></select>
          </div>
          <div class="campo">
            <label class="campo__etiqueta" for="c-precio">Precio del combo</label>
            <div class="control-grupo">
              <span class="control-grupo__prefijo" aria-hidden="true">Bs</span>
              <input class="control control--numero" id="c-precio" type="text" inputmode="decimal" aria-describedby="c-precio-ayuda c-precio-error">
            </div>
            <p class="campo__ayuda" id="c-precio-ayuda">Por separado cuestan <strong class="num" id="c-normal">Bs 0,00</strong>.</p>
            <p class="campo__error" id="c-precio-error" hidden></p>
          </div>
        </fieldset>

        <!-- Regalo -->
        <fieldset class="grupo-campos" data-tipo-campos="regalo" hidden>
          <legend class="grupo-campos__titulo">Regalo por compra</legend>
          <div class="campo">
            <label class="campo__etiqueta" for="r-compra">Compra</label>
            <select class="control" id="r-compra"></select>
          </div>
          <div class="campo">
            <label class="campo__etiqueta" for="r-cantidad">Cantidad</label>
            <input class="control control--numero" id="r-cantidad" type="text" inputmode="numeric" value="2">
          </div>
          <div class="campo campo--ancho">
            <label class="campo__etiqueta" for="r-regalo">Y recibe gratis</label>
            <select class="control" id="r-regalo"></select>
          </div>
        </fieldset>

        <!-- Cumpleaños -->
        <fieldset class="grupo-campos" data-tipo-campos="cumpleanos" hidden>
          <legend class="grupo-campos__titulo">Cumpleaños</legend>
          <div class="campo campo--ancho">
            <label class="campo__etiqueta" for="b-regalo">Regalo</label>
            <select class="control" id="b-regalo"><option>El postre más barato del pedido</option><option>10 % del total</option></select>
            <p class="campo__ayuda">Se verifica la CI del cliente registrado. Una vez por año.</p>
          </div>
        </fieldset>

        <fieldset class="grupo-campos">
          <legend class="grupo-campos__titulo">Cuándo aplica</legend>
          <div class="campo">
            <label class="campo__etiqueta" for="f-desde">Desde <span class="campo__opcional">(opcional)</span></label>
            <input class="control" id="f-desde" type="date">
          </div>
          <div class="campo">
            <label class="campo__etiqueta" for="f-hasta">Hasta <span class="campo__opcional">(opcional)</span></label>
            <input class="control" id="f-hasta" type="date" aria-describedby="f-hasta-error">
            <p class="campo__error" id="f-hasta-error" hidden></p>
          </div>
          <fieldset class="dias campo--ancho">
            <legend class="campo__etiqueta">Días</legend>
            <label class="dia"><input type="checkbox" value="1" checked><span>Lun</span></label>
            <label class="dia"><input type="checkbox" value="2" checked><span>Mar</span></label>
            <label class="dia"><input type="checkbox" value="3" checked><span>Mié</span></label>
            <label class="dia"><input type="checkbox" value="4" checked><span>Jue</span></label>
            <label class="dia"><input type="checkbox" value="5" checked><span>Vie</span></label>
            <label class="dia"><input type="checkbox" value="6" checked><span>Sáb</span></label>
            <label class="dia"><input type="checkbox" value="0" checked><span>Dom</span></label>
          </fieldset>
          <div class="campo">
            <label class="campo__etiqueta" for="h-desde">Desde las</label>
            <input class="control" id="h-desde" type="time" value="11:00">
          </div>
          <div class="campo">
            <label class="campo__etiqueta" for="h-hasta">Hasta las</label>
            <input class="control" id="h-hasta" type="time" value="16:00" aria-describedby="h-hasta-error">
            <p class="campo__error" id="h-hasta-error" hidden></p>
          </div>
        </fieldset>

        <fieldset class="grupo-campos">
          <legend class="grupo-campos__titulo">Condiciones</legend>
          <div class="campo">
            <label class="campo__etiqueta" for="m-cantidad">Cantidad mínima <span class="campo__opcional">(opcional)</span></label>
            <input class="control control--numero" id="m-cantidad" type="text" inputmode="numeric">
          </div>
          <div class="campo">
            <label class="campo__etiqueta" for="m-monto">Monto mínimo del pedido <span class="campo__opcional">(opcional)</span></label>
            <div class="control-grupo">
              <span class="control-grupo__prefijo" aria-hidden="true">Bs</span>
              <input class="control control--numero" id="m-monto" type="text" inputmode="decimal">
            </div>
          </div>
          <div class="campo">
            <label class="campo__etiqueta" for="m-tope">Tope de usos por día <span class="campo__opcional">(opcional)</span></label>
            <input class="control control--numero" id="m-tope" type="text" inputmode="numeric" placeholder="Sin tope">
          </div>
          <div class="campo">
            <label class="campo__etiqueta" for="m-prioridad">Prioridad</label>
            <input class="control control--numero" id="m-prioridad" type="text" inputmode="numeric" value="6" aria-describedby="m-prioridad-ayuda">
            <p class="campo__ayuda" id="m-prioridad-ayuda">Las acumulables se aplican de menor a mayor.</p>
          </div>
          <label class="casilla campo--ancho"><input type="checkbox" id="m-acumulable" checked><span class="casilla__texto"><span class="casilla__titulo">Acumulable</span><span class="casilla__ayuda">Si no lo es, solo se aplica cuando da el mayor beneficio.</span></span></label>
          <label class="casilla campo--ancho"><input type="checkbox" id="m-activa" checked><span class="casilla__texto"><span class="casilla__titulo">Activa</span></span></label>
        </fieldset>

        <div class="formulario__acciones">
          <a class="boton" href="promociones.html">Cancelar</a>
          <button class="boton boton--primario" type="submit" id="guardar-promo">Guardar promoción</button>
        </div>
      </form>
    </main>
