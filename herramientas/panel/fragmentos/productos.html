<!-- {"titulo":"Catálogo","modulo":"catalogo","h1":"Catálogo","js":["datos.js","productos.js"],"cssExtra":["modulos.css"]} -->
    <main class="contenido" id="contenido">
      <div class="catalogo-cabeza">
        <nav class="subnav" aria-label="Catálogo">
          <a class="subnav__enlace" href="productos.html" aria-current="page">Productos</a>
          <a class="subnav__enlace" href="categorias.html">Categorías</a>
        </nav>
        <a class="boton boton--primario" href="producto-form.html" data-requiere="catalogo.editar">
          <svg class="icono" aria-hidden="true"><use href="#i-mas"></use></svg>
          Nuevo producto
        </a>
      </div>

      <div class="alerta aviso-guardado" role="status" hidden>
        <svg class="icono" aria-hidden="true"><use href="#i-ok"></use></svg>
        <p class="alerta__titulo">Producto guardado</p>
        <p class="alerta__texto">Ya aparece en el punto de venta.</p>
      </div>

      <div class="herramientas">
        <div class="herramientas__busqueda control-grupo">
          <svg class="icono control-grupo__icono" aria-hidden="true"><use href="#i-buscar"></use></svg>
          <label class="visualmente-oculto" for="buscar">Buscar producto</label>
          <input class="control" id="buscar" type="search" placeholder="Nombre o código" autocomplete="off">
        </div>
        <div class="herramientas__filtro">
          <label class="visualmente-oculto" for="estado">Estado</label>
          <select class="control" id="estado">
            <option value="">Todos</option>
            <option value="favorito">Favoritos</option>
            <option value="agotado">Agotados</option>
            <option value="inactivo">Inactivos</option>
            <option value="cocina">Van a cocina</option>
          </select>
        </div>
      </div>

      <div class="pestanas pestanas--categorias" id="pestanas" role="group" aria-label="Categoría">
        <button class="pestana" type="button" data-categoria="" aria-pressed="true">Todas <span class="pestana__cuenta">25</span></button>
      </div>

      <p class="resultado"><span class="resultado__cuenta" id="cuenta">25 productos</span></p>

      <div class="tabla-contenedor">
        <table class="tabla tabla--catalogo tabla--fichas">
          <caption class="visualmente-oculto">Productos del catálogo</caption>
          <thead>
            <tr>
              <th scope="col">Producto</th>
              <th scope="col">Categoría</th>
              <th scope="col" class="col-num">Precio</th>
              <th scope="col">Marcas</th>
              <th scope="col">Estado</th>
              <th scope="col" class="col-accion"><span class="visualmente-oculto">Acciones</span></th>
            </tr>
          </thead>
          <tbody id="filas"></tbody>
        </table>
        <div class="vacio" id="vacio" hidden>
          <svg class="icono icono--lg vacio__icono" aria-hidden="true"><use href="#i-buscar"></use></svg>
          <h2 class="vacio__titulo">Ningún producto coincide</h2>
          <p class="vacio__texto" id="vacio-texto">Prueba con otro nombre o código.</p>
          <button class="boton" type="button" id="limpiar">Quitar filtros</button>
        </div>
      </div>

      <p class="visualmente-oculto" aria-live="polite" id="anuncio"></p>
    </main>
