<!-- {"titulo":"Pedidos","modulo":"mesero","h1":"Tomar pedido","js":["datos.js","mesero.js"],"cssExtra":["pos.css"]} -->
    <main class="contenido contenido--angosto" id="contenido">
      <form class="mesero" id="form-mesero" novalidate>
        <div class="mesero__mesa">
          <label class="campo__etiqueta" for="m-mesa">Mesa</label>
          <div class="mesas" role="group" aria-label="Mesa">
            <button class="mesa-opcion" type="button" data-mesa="1">1</button>
            <button class="mesa-opcion" type="button" data-mesa="2">2</button>
            <button class="mesa-opcion" type="button" data-mesa="3">3</button>
            <button class="mesa-opcion" type="button" data-mesa="4" aria-pressed="true">4</button>
            <button class="mesa-opcion" type="button" data-mesa="5">5</button>
            <button class="mesa-opcion" type="button" data-mesa="6">6</button>
            <button class="mesa-opcion" type="button" data-mesa="7">7</button>
            <button class="mesa-opcion" type="button" data-mesa="8">8</button>
          </div>
          <input type="hidden" id="m-mesa" value="4">
        </div>

        <div class="categorias-pos" id="m-categorias" role="group" aria-label="Categorías"></div>
        <ul class="grilla-productos grilla-productos--compacta" id="m-grilla" role="list"></ul>

        <div class="mesero__pedido" aria-labelledby="t-mesero-pedido">
          <h2 class="pos__pedido-titulo" id="t-mesero-pedido">Pedido de la mesa <span id="m-mesa-titulo">4</span></h2>
          <ul class="lineas" id="m-lineas" role="list"></ul>
          <p class="lineas-vacio" id="m-vacio">Toca un plato para agregarlo.</p>
          <p class="totales__total"><span class="totales__etiqueta">Total</span><span class="totales__monto"><span class="totales__moneda">Bs</span><span id="m-total">0,00</span></span></p>
          <button class="boton boton--primario boton--grande boton--bloque" type="submit" id="m-enviar" disabled>
            <svg class="icono" aria-hidden="true"><use href="#i-enviar"></use></svg>
            Enviar a caja
          </button>
        </div>
      </form>
    </main>
